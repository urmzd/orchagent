name: CI

on:
  pull_request:
    branches: [main, "feat/session-*"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "sandbox/runner/k8s"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - uses: golangci/golangci-lint-action@v7
        with:
          working-directory: ${{ matrix.module }}

  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "sandbox/runner/k8s"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: go vet ./...
        working-directory: ${{ matrix.module }}
      - run: go test -race ./...
        working-directory: ${{ matrix.module }}

  integration:
    name: Integration (Postgres, Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: orchagent
          POSTGRES_PASSWORD: orchagent
          POSTGRES_DB: orchagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orchagent"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      DURABLE_POSTGRES_URL: postgres://orchagent:orchagent@localhost:5432/orchagent?sslmode=disable
      DURABLE_REDIS_ADDR: localhost:6379
      FLOW_POSTGRES_TEST_URL: postgres://orchagent:orchagent@localhost:5432/orchagent?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply quickstart schema
        run: psql "$DURABLE_POSTGRES_URL" -f durable/examples/quickstart/schema.sql
      - name: Durable adapters and chaos example
        run: go test -tags=integration ./durable/adapters/... ./durable/examples/chaos/...
      - name: Flow Postgres stores
        run: go test -count=1 ./flow/...

  gvisor:
    name: Sandbox under gVisor
    runs-on: ubuntu-latest
    env:
      # A pinned gVisor release, checked against this digest before use.
      GVISOR_RELEASE: "20261012"
      GVISOR_SHA512: 9606445eed5aedfcf05310e7ccef61d994089914c6622fc82624c24d2b18db1b2210f40e40a7be27b8b7772859de7d95c501b4eba66423053c960bf671377c5e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install runsc as a Docker runtime
        run: |
          curl -fsSLo "$RUNNER_TEMP/gvisor.tar.bz2" "https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/x86_64/gvisor.tar.bz2"
          echo "${GVISOR_SHA512}  $RUNNER_TEMP/gvisor.tar.bz2" | sha512sum --check --strict
          tar -xjf "$RUNNER_TEMP/gvisor.tar.bz2" -C "$RUNNER_TEMP" runsc
          sudo install -m 0755 "$RUNNER_TEMP/runsc" /usr/local/bin/runsc
          # --oci-seccomp: gVisor enforces the driver's seccomp profile too.
          # --host-uds=all: compartments' unix sockets cross sandboxes through
          # the shared socket directory.
          sudo runsc install -- --oci-seccomp --host-uds=all
          sudo systemctl restart docker
          runsc --version
      - name: Conformance suite under runsc
        env:
          SANDBOX_DOCKER_TEST_RUNTIME: runsc
          SANDBOX_DOCKER_TEST_REQUIRED: "1"
        run: go test -race -count=1 -v ./sandbox/isolate/docker/
