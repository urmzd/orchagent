# Quickstart infrastructure. Not architecturally required: the ledger and
# queue are interfaces, and a Postgres-only (or fully in-memory) deployment
# is supported. The suggested schema is applied by Postgres's own init hook,
# never by durable code.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: orchagent
      POSTGRES_PASSWORD: orchagent
      POSTGRES_DB: orchagent
    ports:
      - "5432:5432"
    volumes:
      - ./durable/examples/quickstart/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchagent"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
